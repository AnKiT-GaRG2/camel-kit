quarkus.log.level=INFO
quarkus.mcp.server.server-info.name=camel-kit-knowledge
quarkus.mcp.server.server-info.version=${quarkus.application.version}

# Disable banner on stdout — stdio MCP requires clean JSON-RPC on stdout
quarkus.banner.enabled=false

# HTTP disabled by default — stdio is the primary transport.
# To enable HTTP/SSE, pass -Dquarkus.http.host-enabled=true -Dquarkus.http.port=9090
quarkus.http.host-enabled=false

# Build uber-jar so jbang can run it as a single artifact
quarkus.package.jar.type=uber-jar

# Discover the newest published compatible index on the first knowledge query.
# knowledge.index.releases-url=https://api.github.com/repos/apache/camel-kit/releases
# knowledge.index.version=2026.10.26-120000             # optional exact index pin
# knowledge.index.path=/path/to/knowledge-index         # local directory, no network
# knowledge.index.url=https://example.org/index.json    # explicit manifest, bypass discovery
# knowledge.index.cache-dir=${user.home}/.camel-kit/knowledge-index
