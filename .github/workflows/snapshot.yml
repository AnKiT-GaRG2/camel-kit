name: Deploy Snapshot

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Snapshot target (all is also used by the nightly build)
        type: choice
        default: all
        options: [all, parent, kit, knowledge]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Deploy snapshot
        run: |
          set -euo pipefail
          target_args=()
          profiles=sourcecheck
          if [[ "$SNAPSHOT_TARGET" == all || "$SNAPSHOT_TARGET" == kit ]]; then
            profiles+=,linux-ship-certification
          fi
          if [[ "$SNAPSHOT_TARGET" == all ]]; then
            for target in parent kit knowledge; do
              python3 tools/release_target.py "$target" --snapshot
            done
          else
            arguments=$(python3 tools/release_target.py "$SNAPSHOT_TARGET" --snapshot)
            mapfile -t target_args <<< "$arguments"
          fi
          ./mvnw -B "${target_args[@]}" -P"$profiles" -Deval.requireVectors=true -DdeployAtEnd=true deploy
        env:
          SNAPSHOT_TARGET: ${{ inputs.target || 'all' }}
          MAVEN_USERNAME: ${{ secrets.MVN_CENTRAL_USER }}
          MAVEN_PASSWORD: ${{ secrets.MVN_CENTRAL_PASSWORD }}

  smoke-install:
    name: Verify snapshot installation
    needs: deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'kit')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Install snapshot in a clean JBang container
        run: |
          snapshot_version=$(python3 tools/release_target.py kit --snapshot --version)
          [[ "$snapshot_version" == *-SNAPSHOT ]]

          for attempt in {1..10}; do
            if docker run --rm \
              --entrypoint /bin/bash \
              -e SNAPSHOT_VERSION="$snapshot_version" \
              docker.io/jbangdev/jbang-action:0.139.3@sha256:f5d2d51955d4b6c8ed005b880e6b5f48f0322585298d7e3c146f8241e2d44b01 -lc '
                set -euo pipefail
                export HOME=/tmp/camel-kit-smoke
                export JBANG_DIR="$HOME/.jbang"
                export JBANG_REPO="$HOME/.m2/repository"
                export JAVA_TOOL_OPTIONS="-Duser.home=$HOME -Dmaven.repo.local=$JBANG_REPO"
                export JBANG_NO_VERSION_CHECK=1
                export PATH="$JBANG_DIR/bin:/jbang/bin:$PATH"

                mkdir -p "$HOME" "$JBANG_REPO"
                jbang trust add https://github.com/apache/camel-kit/
                jbang app install camel-kit@apache/camel-kit
                test "$(camel-kit --version)" = "$SNAPSHOT_VERSION"
              '; then
              exit 0
            fi

            if [ "$attempt" -eq 10 ]; then
              exit 1
            fi

            echo "Snapshot not visible yet; retrying in 30 seconds"
            sleep 30
          done
